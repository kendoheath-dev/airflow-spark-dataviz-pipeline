services:
  spark-master:
    container_name: spark-master
    build:
      context: .
      dockerfile: ./spark/Dockerfile.spark
    environment:
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark-master
      SPARK_PORT: 7077
      # SPARK_DEPLOY_MODE: cluster
      SPARK_DEPLOY_MODE: client
    ports:
      - 7077:7077
      - 8080:8080

    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --webui-port 8080
    restart: always 
    volumes:
      - ./spark/src:/opt/spark/jobs
    networks:
      - data_pipeline_net
  spark-worker:
    container_name: spark-worker
    build:
      context: .
      dockerfile: ./spark/Dockerfile.spark
    restart: always 
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
# since the worker connnect to the master internally on the docker network, it doesnt need to 7077 to the host
    ports:
      - 8081:8081                                                     
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --webui-port 8081
    volumes:
      - ./spark/src:/opt/spark/jobs
    networks:
      - data_pipeline_net
    depends_on:
      - spark-master  

  livy:
    container_name: livy
    build:
      context: .
      dockerfile: ./livy/Dockerfile.livy
    ports:
      - "8998:8998"
    depends_on:
      - spark-master
    environment:
      SPARK_MASTER_URL: spark://spark-master:7077  
    volumes:
      - ./spark/src:/opt/spark/jobs
      - ./livy/logs:/opt/livy/apache-livy-0.8.0-incubating_2.11-bin/logs
      - ./livy/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    networks:
      - data_pipeline_net
  db:
    container_name: db
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - 5431:5432
    volumes:
      - airflow_db_volume:/var/lib/postgresql/data
    networks:
      - data_pipeline_net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: always
  x-airflow-common:
    &airflow-common
    build:
      context: .
      dockerfile: ./airflow_home/Dockerfile.airflow
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      # AIRFLOW__WEBSERVER__AUTH__BACKEND: airflow.www.security.NoAuthBackend
      # AIRFLOW__WEBSERVER__AUTHENTICATE: False
      # AIRFLOW_DATABASE_SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@db/airflow
      AIRFLOW_CONN_SPARK_DEFAULT: spark://spark-master:7077
      AIRFLOW_CONN_LIVY_CONN: http://livy:8998
      AIRFLOW_CONN_POSTGRES_WAREHOUSE: postgresql+psycopg2://postgres:password@postgres_warehouse:5432/warehouse_db
      AIRFLOW_CONN_POSTGRES_STAGING: postgresql+psycopg2://postgres:password@postgres_staging:5432/staging_db
      SPARK_MASTER_URL: spark://spark-master:7077
    networks:
      - data_pipeline_net
    volumes:
      - ./airflow_home/dags:/opt/airflow/dags
      - ./airflow_home/webserver_config.py:/opt/airflow/webserver_config.py
      # - ./airflow_home/airflow.cfg:/opt/airflow/airflow.cfg

    depends_on: 
      - postgres_staging
      - spark-master
      - spark-worker
      - livy
      - db

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@db:5432/airflow
    # command: ["bash", "-c", "airflow db migrate"]
    networks:
      - data_pipeline_net
    command: >
      bash -c "
        until pg_isready -h db -p 5432 -U airflow; do
          echo 'waiting for postgres..........'
          sleep 2
        done
        airflow db migrate
      "


     # airflow db migrate
  airflow_webserver:
    <<: *airflow-common
    container_name: airflow_webserver
    command: airflow webserver
    restart: always
    ports:
      - 9999:8080
    volumes:
      - ./airflow_home/webserver_config.py:/opt/airflow/webserver_config.py
    depends_on:
      airflow-init:
        condition: service_completed_successfully
  airflow_scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler
    command: airflow scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      # db:
      #   condition: service_completed_successfully
    networks:
      - data_pipeline_net
  postgres_staging:
    image: postgres:15
    container_name: postgres_staging
    environment: 
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: staging_db
      # TZ: America/New_York
    ports:
      - 5432:5432
    networks:
      - data_pipeline_net
    volumes:
      - ./db/postgres_staging/init.sql:/docker-entrypoint-initdb.d/init.sql
      - staging_db_volume:/var/lib/postgresql/data
      # - staging_db_volume:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 5
    restart: always
  postgres_warehouse:
    image: postgres:15
    container_name: postgres_warehouse
    environment: 
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: warehouse_db
      TZ: America/New_York
    ports:
      - 5433:5432
    networks:
      - data_pipeline_net
    volumes:
      - ./db/postgres_warehouse/init.sql:/docker-entrypoint-initdb.d/init.sql
      # - warehouse_db_volume:/var/lib/postgresql/data
      - warehouse_db_volume:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 5
    restart: always
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    ports: 
    - 3000:3000
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: warehouse_db
      MB_DB_PORT: 5433
      MB_DB_USER: postgres
      MB_DB_PASS: password
      MB_DB_HOST: host.docker.internal
    networks:
      - data_pipeline_net

volumes:
  airflow_db_volume:
  staging_db_volume:
  warehouse_db_volume:
  # shared_script:
  
networks:
  data_pipeline_net:
    driver: bridge